<!DOCTYPE html>
<html lang="es" data-theme="light" data-i18n-title-doc="auth.documentTitle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Seguridad: CSP + metas defensivas -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com;
               img-src 'self' data: https:;
               connect-src 'self';
               object-src 'none';
               base-uri 'self';
               form-action 'self';
               frame-ancestors 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">

<title>Job Tracker · Sign in</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">

<style>
  .auth-error {
    margin-top: 0.9rem;
    padding: 0.65rem 0.85rem;
    background: rgba(239, 68, 68, 0.10);
    border: 1px solid rgba(239, 68, 68, 0.35);
    border-radius: 10px;
    color: #dc2626;
    font-size: 0.85rem;
    font-weight: 500;
    text-align: center;
    line-height: 1.35;
  }
  [data-theme="dark"] .auth-error {
    background: rgba(239, 68, 68, 0.15);
    color: #fca5a5;
  }
  .auth-error + .btn,
  .auth-error ~ .btn {
    margin-top: 0;
  }
  button[disabled],
  input[disabled] {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>
</head>
<body class="auth-body">

<!-- Theme toggle (top-right) -->
<button class="icon-btn auth-theme-toggle" id="themeToggle" title="Cambiar tema" data-i18n-title="action.theme">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
  </svg>
</button>

<!-- Centered card -->
<main class="auth-screen">
  <div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
      <div class="brand-logo" id="brandLogo"></div>
      <div>
        <h1 data-i18n="app.name">Job Tracker</h1>
        <p data-i18n="app.subtitle">Tu búsqueda laboral, organizada</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-auth-tab="login" data-i18n="auth.tab.login">Sign in</button>
      <button type="button" class="auth-tab" data-auth-tab="register" data-i18n="auth.tab.register">Create account</button>
    </div>

    <!-- Login form -->
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginEmail" data-i18n="auth.identifier">Usuario</label>
        <input type="text" id="loginEmail" autocomplete="username"
               placeholder="Usuario" data-i18n-placeholder="auth.identifier.placeholder">
      </div>
      <div class="field field-password">
        <label for="loginPassword" data-i18n="auth.password">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password"
               placeholder="••••••••" data-i18n-placeholder="auth.password.placeholder">
        <button type="button" class="pw-toggle" data-i18n-title="auth.showPassword" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" id="loginRemember" checked>
          <span data-i18n="auth.remember">Remember me</span>
        </label>
        <a href="#" class="link-muted" data-i18n="auth.forgot">Forgot your password?</a>
      </div>
      <button type="submit" class="btn btn-primary" data-i18n="auth.submit.login">Sign in</button>
    </form>

    <!-- Register form (disabled in the mocked build) -->
    <form id="registerForm" novalidate style="display:none;">
      <div class="field">
        <label for="registerName" data-i18n="auth.name">Name</label>
        <input type="text" id="registerName" autocomplete="name"
               placeholder="Your name" data-i18n-placeholder="auth.name.placeholder">
      </div>
      <div class="field">
        <label for="registerEmail" data-i18n="auth.email">Email</label>
        <input type="email" id="registerEmail" autocomplete="email"
               placeholder="you@email.com" data-i18n-placeholder="auth.email.placeholder">
      </div>
      <div class="field field-password">
        <label for="registerPassword" data-i18n="auth.password">Password</label>
        <input type="password" id="registerPassword" autocomplete="new-password"
               placeholder="At least 8 characters" data-i18n-placeholder="auth.password.new.placeholder">
        <button type="button" class="pw-toggle" data-i18n-title="auth.showPassword" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button type="submit" class="btn btn-primary" data-i18n="auth.submit.register">Create account</button>
    </form>

    <!-- Social -->
    <div class="divider" data-i18n="auth.orContinue">or continue with</div>
    <div class="socials">
      <button type="button" class="btn-social" data-provider="google">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google
      </button>
      <button type="button" class="btn-social" data-provider="github">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57L9 21.07c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.08-.74.09-.73.09-.73 1.2.09 1.83 1.24 1.83 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.31.76-1.61-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.81 1.1.81 2.22 0 1.6-.01 2.9-.01 3.29 0 .31.22.7.83.57A12 12 0 0 0 12 .3z"/>
        </svg>
        GitHub
      </button>
    </div>

  </div>
</main>

<script type="module" src="./js/auth/login.js"></script>
</body>
</html>
